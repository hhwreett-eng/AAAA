[settings]
report_title = "US Tech Stock Creator Daily Monitor"
report_dir = "reports"
state_dir = "state"
lookback_hours = 72
max_items_per_source = 25
state_retention_days = 180
pause_seconds_between_sources = 0.5
include_items_without_keywords = true
keywords = [
  "NVIDIA",
  "NVDA",
  "Blackwell",
  "Rubin",
  "CUDA",
  "GPU",
  "AI infrastructure",
  "hyperscaler",
  "hyperscalers",
  "CSP",
  "cloud",
  "AWS",
  "Azure",
  "Google Cloud",
  "Oracle Cloud",
  "CoreWeave",
  "neocloud",
  "data center",
  "datacenter",
  "capex",
  "AMD",
  "TSMC",
  "ASML",
  "Broadcom",
  "AVGO",
  "Marvell",
  "MRVL",
  "HBM",
  "memory",
  "networking"
]

[delivery.email]
enabled = true
smtp_host = "smtp.gmail.com"
smtp_port = 587
username_env = "SMTP_USERNAME"
password_env = "SMTP_PASSWORD"
from = "SMTP_USERNAME"
to = ["SMTP_USERNAME", "372974665@qq.com", "1102548187@qq.com"]
subject = "US Tech Stock Creator Daily Monitor"

